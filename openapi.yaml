components:
  schemas:
    AdminUploadDto:
      type: object
      properties:
        anon:
          type: boolean
        approved:
          type: boolean
        contentType:
          type: string
          enum:
          - image
          - video
          - audio
          - document
        createdDate:
          type: string
          format: date-time
        displayName:
          type: string
        eventId:
          type: string
          format: uuid
        eventName:
          type: string
        featured:
          type: boolean
        fileName:
          type: string
        fileUrl:
          type: string
        instagramHandle:
          type: string
        secureUrl:
          type: string
        thumbnailUrl:
          type: string
        uploadDescription:
          type: string
        uploadedBy:
          type: string
          format: uuid
        uploaderEmail:
          type: string
        uploaderFirstName:
          type: string
        uploaderFullName:
          type: string
        uploaderLastName:
          type: string
        uploaderStudentNumber:
          type: string
        uuid:
          type: string
          format: uuid
    AgendaFrameConfig:
      allOf:
      - $ref: "#/components/schemas/FrameConfig"
      - type: object
        properties:
          days:
            type: array
            items:
              $ref: "#/components/schemas/DayBucket"
          heading:
            type: string
    AgentEnrollRequest:
      type: object
      properties:
        agentVersion:
          type: string
        hardwareModel:
          type: string
        hostname:
          type: string
          minLength: 1
        publicKey:
          type: string
