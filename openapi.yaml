          description: Token valid; user returned
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: "Token missing, expired, or user no longer exists"
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      summary: Check the current access token and return the user it belongs to
      tags:
      - auth-controller
