          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Password changed; all sessions revoked
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Current password incorrect or new password rejected
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Not signed in
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      summary: Change the signed-in user's password
      tags:
      - auth-controller
  /api/auth/forgot-password:
    post:
      description: Always reports success so the response cannot be used to probe
        which addresses are registered.
      operationId: requestPasswordReset
      parameters:
      - in: query
        name: email
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request accepted
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Email missing
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      summary: Send a password reset email
      tags:
      - auth-controller
  /api/auth/logout:
    post:
      description: "Succeeds even when no token is supplied, so signing out is idempotent."
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRefreshRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Session ended
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      summary: Revoke a single refresh token
      tags:
      - auth-controller
  /api/auth/logout-all-devices:
    post:
      operationId: logoutAllDevices
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: All sessions ended
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Not signed in
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      summary: Revoke every refresh token for the signed-in user
      tags:
      - auth-controller
  /api/auth/refresh-token:
    post:
      description: "Rotates the refresh token: the supplied one is revoked and a new\
        \ one returned."
      operationId: refreshToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRefreshRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenRefreshResponse"
          description: New access and refresh tokens issued
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: "Refresh token unknown, expired or already revoked"
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      summary: Exchange a refresh token for a new access token
      tags:
      - auth-controller
  /api/auth/reset-password:
    post:
      description: "The token and password travel in the request body, not the query\
        \ string: query strings are recorded in access logs, proxies and browser history."
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Password reset
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: "Token or password missing, invalid or expired"
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      summary: Set a new password using a reset token
      tags:
      - auth-controller
  /api/auth/signin:
    post:
      operationId: signIn
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JwtResponse"
          description: Authenticated; access and refresh tokens issued
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Bad credentials or disabled account
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Too many failed attempts; account temporarily locked
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      summary: Authenticate with email and password
      tags:
      - auth-controller
  /api/auth/signup:
    post:
      operationId: signUp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Account created; verification email sent
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Validation failed or email already registered
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      summary: Register a new account
      tags:
      - auth-controller
  /api/auth/validate-reset-token:
    post:
      description: "A POST despite being a read: the token is a credential, and only\
        \ a body keeps it out of access logs, proxy logs and browser history. Being\
        \ a POST also stops the result being cached by an intermediary."
      operationId: validateResetToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateResetTokenRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Token is valid
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: "Token missing, invalid or expired"
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      summary: Check whether a password reset token is still usable
      tags:
      - auth-controller
  /api/auth/validate-token:
    get:
      operationId: validateToken
      responses:
        "200":
          content:
            application/json:
