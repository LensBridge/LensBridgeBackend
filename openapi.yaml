          description: Device enrolled; identity and websocket URL returned
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Public key malformed or unsupported
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: "Enrollment token invalid, expired, or already used"
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      summary: Exchange a one-time enrollment token for a device identity
      tags:
      - agent-enrollment-controller
