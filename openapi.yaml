openapi: 3.1.0
info:
  description: LensBridge backend — media upload and MusallahBoard management
  title: LensBridge API
  version: 0.0.1-SNAPSHOT
servers:
- url: /
security:
- bearerAuth: []
paths:
  /api/admin/audit:
    get:
      operationId: getAuditEvents
      parameters:
      - description: Zero-based page index (0..N)
        in: query
        name: page
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - description: The size of the page to be returned
        in: query
        name: size
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        in: query
        name: sort
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageAuditEventDto"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      tags:
      - admin-controller
  /api/admin/audit/action/{action}:
    get:
      operationId: getAuditEventsByAction
      parameters:
      - in: path
        name: action
        required: true
        schema:
          type: string
          enum:
          - APPROVE_UPLOAD
          - UNAPPROVE_UPLOAD
          - DELETE_UPLOAD
          - FEATURE_UPLOAD
          - UNFEATURE_UPLOAD
          - CREATE_EVENT
          - UPDATE_EVENT
          - DELETE_EVENT
          - CREATE_CALENDAR_EVENT
          - UPDATE_CALENDAR_EVENT
          - DELETE_CALENDAR_EVENT
          - LINK_TICKET_EVENT
          - UNLINK_TICKET_EVENT
          - CREATE_POSTER
          - UPDATE_POSTER
          - DELETE_POSTER
          - CREATE_SOCIAL
          - UPDATE_SOCIAL
          - DELETE_SOCIAL
          - SAVE_WEEKLY_CONTENT
          - DELETE_WEEKLY_CONTENT
          - UPDATE_BOARD_CONFIG
          - UPDATE_BOARD_TICKER
          - REFRESH_BOARDS
          - ISSUE_ENROLLMENT_TOKEN
          - REVOKE_DEVICE
          - ISSUE_DEVICE_COMMAND
          - PROMOTE_USER
          - DEMOTE_USER
          - DISABLE_USER
          - ENABLE_USER
          - VIEW_AUDIT_LOGS
          - EXPORT_DATA
          - SYSTEM_MAINTENANCE
          - VERIFY_USER
          - UNVERIFY_USER
          - RESET_USER_PASSWORD
          - TRIGGER_PASSWORD_RESET_EMAIL
          - ADD_USER_ROLE
          - REMOVE_USER_ROLE
          - GRANT_PERMISSION
          - REVOKE_PERMISSION
          - ADD_USER
          - REMOVE_USER
          - UPDATE_USER
      - description: Zero-based page index (0..N)
        in: query
        name: page
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - description: The size of the page to be returned
        in: query
        name: size
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        in: query
        name: sort
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageAuditEventDto"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      tags:
      - admin-controller
  /api/admin/audit/actions:
    get:
      operationId: getAvailableAuditActions
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  enum:
                  - APPROVE_UPLOAD
                  - UNAPPROVE_UPLOAD
                  - DELETE_UPLOAD
                  - FEATURE_UPLOAD
                  - UNFEATURE_UPLOAD
                  - CREATE_EVENT
                  - UPDATE_EVENT
                  - DELETE_EVENT
                  - CREATE_CALENDAR_EVENT
                  - UPDATE_CALENDAR_EVENT
                  - DELETE_CALENDAR_EVENT
                  - LINK_TICKET_EVENT
                  - UNLINK_TICKET_EVENT
                  - CREATE_POSTER
                  - UPDATE_POSTER
                  - DELETE_POSTER
                  - CREATE_SOCIAL
                  - UPDATE_SOCIAL
                  - DELETE_SOCIAL
                  - SAVE_WEEKLY_CONTENT
                  - DELETE_WEEKLY_CONTENT
                  - UPDATE_BOARD_CONFIG
                  - UPDATE_BOARD_TICKER
                  - REFRESH_BOARDS
                  - ISSUE_ENROLLMENT_TOKEN
                  - REVOKE_DEVICE
                  - ISSUE_DEVICE_COMMAND
                  - PROMOTE_USER
                  - DEMOTE_USER
                  - DISABLE_USER
                  - ENABLE_USER
                  - VIEW_AUDIT_LOGS
                  - EXPORT_DATA
                  - SYSTEM_MAINTENANCE
                  - VERIFY_USER
                  - UNVERIFY_USER
                  - RESET_USER_PASSWORD
                  - TRIGGER_PASSWORD_RESET_EMAIL
                  - ADD_USER_ROLE
                  - REMOVE_USER_ROLE
                  - GRANT_PERMISSION
                  - REVOKE_PERMISSION
                  - ADD_USER
                  - REMOVE_USER
                  - UPDATE_USER
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      summary: List the audit action types available for filtering
      tags:
      - admin-controller
  /api/admin/audit/daterange:
    get:
      operationId: getAuditEventsByDateRange
      parameters:
      - in: query
        name: start
        required: true
        schema:
          type: string
          format: date-time
      - in: query
        name: end
        required: true
        schema:
          type: string
          format: date-time
      - description: Zero-based page index (0..N)
        in: query
        name: page
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - description: The size of the page to be returned
        in: query
        name: size
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        in: query
        name: sort
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageAuditEventDto"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      tags:
      - admin-controller
  /api/admin/audit/failed:
    get:
      operationId: getFailedOperations
      parameters:
      - description: Zero-based page index (0..N)
        in: query
        name: page
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - description: The size of the page to be returned
        in: query
        name: size
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        in: query
        name: sort
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageAuditEventDto"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      tags:
      - admin-controller
  /api/admin/audit/upload/{uploadId}:
    get:
      operationId: getUploadAuditHistory
      parameters:
      - in: path
        name: uploadId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEventDto"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      tags:
      - admin-controller
  /api/admin/board/configs:
    get:
      operationId: getAllBoardConfigs
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceConfig"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      tags:
      - board-admin-controller
  /api/admin/board/configs/{deviceId}:
    get:
      operationId: getAdminBoardConfig
      parameters:
      - in: path
        name: deviceId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceConfig"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      summary: Fetch a device config as an administrator
      tags:
      - board-admin-controller
    patch:
      operationId: updateBoardConfig
      parameters:
      - in: path
        name: deviceId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBoardConfigRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceConfig"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      tags:
      - board-admin-controller
    put:
      operationId: saveBoardConfig
      parameters:
      - in: path
        name: deviceId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceConfig"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceConfig"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      tags:
      - board-admin-controller
  /api/admin/board/configs/{deviceId}/ticker:
    patch:
      operationId: updateBoardTicker
      parameters:
      - in: path
        name: deviceId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTickerRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceConfig"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      summary: Update a board's scrolling messages
      tags:
      - board-admin-controller
  /api/admin/board/devices:
    get:
      operationId: listDevices
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceSummary"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      summary: List every enrolled board device
      tags:
      - device-admin-controller
  /api/admin/board/devices/enrollment-tokens:
    post:
      operationId: issueEnrollmentToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueEnrollmentTokenRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueEnrollmentTokenResponse"
          description: Token issued; the plaintext is returned exactly once
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      summary: Mint a one-time token a new device can exchange for an identity
      tags:
      - device-admin-controller
  /api/admin/board/devices/{deviceId}:
    get:
      operationId: getDevice
      parameters:
      - in: path
        name: deviceId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceSummary"
          description: Device found
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: No device with that id
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      summary: Fetch a single board device
      tags:
      - device-admin-controller
    patch:
      operationId: updateDevice
      parameters:
      - in: path
        name: deviceId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeviceRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceSummary"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      tags:
      - board-admin-controller
  /api/admin/board/devices/{deviceId}/commands:
    get:
      operationId: listDeviceCommands
      parameters:
      - in: path
        name: deviceId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommandView"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      summary: Fetch the 50 most recent commands for a device
      tags:
      - device-admin-controller
    post:
      description: "Returns as soon as the command is queued; delivery and execution\
        \ are reported asynchronously over the agent websocket. The permission required\
        \ depends on the command kind: board:command:benign, :disruptive, or :inspect."
      operationId: issueDeviceCommand
      parameters:
      - in: path
        name: deviceId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueCommandRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandIssuedResponse"
          description: Command accepted and queued for delivery
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Caller lacks the permission for this command kind
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      summary: Queue a command for a device
      tags:
      - device-admin-controller
  /api/admin/board/devices/{deviceId}/revoke:
    post:
      description: "Closes any live agent session. Idempotent: re-revoking an already\
        \ revoked device is a no-op."
      operationId: revokeDevice
      parameters:
      - in: path
        name: deviceId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceSummary"
          description: Device revoked
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: No device with that id
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      summary: Revoke a device's enrollment
      tags:
      - device-admin-controller
  /api/admin/board/events:
    get:
      operationId: getBoardEvents
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BoardEvent"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      summary: List every board event
      tags:
      - board-admin-controller
    post:
      operationId: createBoardEvent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCalendarEventRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardEvent"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      summary: Create a board event
      tags:
      - board-admin-controller
  /api/admin/board/events/by-audience:
    get:
      operationId: getEventsForAudience
      parameters:
      - in: query
        name: audience
        required: true
        schema:
          type: string
          enum:
          - brothers
          - sisters
          - both
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BoardEvent"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      tags:
      - board-admin-controller
  /api/admin/board/events/{eventId}:
    delete:
      operationId: deleteEvent_1
      parameters:
      - in: path
        name: eventId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      tags:
      - board-admin-controller
    get:
      operationId: getBoardEventById
      parameters:
      - in: path
        name: eventId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardEvent"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      summary: Fetch a single board event
      tags:
      - board-admin-controller
    patch:
      operationId: updateEvent_1
      parameters:
      - in: path
        name: eventId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCalendarEventRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardEvent"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      tags:
      - board-admin-controller
  /api/admin/board/events/{eventId}/ticket-event:
    delete:
      operationId: unlinkTicketEvent
      parameters:
      - in: path
        name: eventId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardEvent"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      summary: Unlink the tCketManage event from a board event
      tags:
      - board-admin-controller
  /api/admin/board/events/{eventId}/ticket-event/{tcketEventId}:
    put:
      operationId: linkTicketEvent
      parameters:
      - in: path
        name: eventId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: tcketEventId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardEvent"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      summary: Link a tCketManage event to a board event
      tags:
      - board-admin-controller
  /api/admin/board/posters:
    get:
      operationId: getAllPosters
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Poster"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      tags:
      - board-admin-controller
    post:
      operationId: createPoster
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreatePosterRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Poster"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      tags:
      - board-admin-controller
  /api/admin/board/posters/by-audience:
    get:
      operationId: getPostersForAudience
      parameters:
      - in: query
        name: audience
        required: true
        schema:
          type: string
          enum:
          - brothers
          - sisters
          - both
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Poster"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      tags:
      - board-admin-controller
  /api/admin/board/posters/{posterId}:
    delete:
      operationId: deletePoster
      parameters:
      - in: path
        name: posterId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      tags:
      - board-admin-controller
    get:
      operationId: getPosterById
      parameters:
      - in: path
        name: posterId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Poster"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Request failed; body carries a human-readable message
      tags:
      - board-admin-controller
    patch:
      operationId: updatePoster
      parameters:
      - in: path
        name: posterId
        required: true
