# Configuration for generating openapi.yaml (./mvnw -P openapi verify -DskipTests).
#
# The spec is scraped from a running app, so it has to boot without a developer's own
# application.properties (which is gitignored) -- in CI there is none. Every value here is a
# placeholder: nothing is contacted while the spec is generated, only the context has to start.
# Loaded through spring.config.additional-location by the openapi profile in pom.xml.

spring.datasource.url=jdbc:sqlite:target/openapi-gen.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration/sqlite

frontend.baseurl=http://localhost:5173
musallahboard.baseurl=http://localhost:3000
musallahboard.agent.websocketUrl=ws://localhost:8080/api/agent/ws

cloudflare.r2.endpoint=https://example.invalid
cloudflare.r2.access-key-id=openapi-gen
cloudflare.r2.secret-access-key=openapi-gen
cloudflare.r2.bucket-name=openapi-gen
cloudflare.r2.public-url=https://example.invalid

lensbridge.app.jwtSecret=b3BlbmFwaS1nZW4tcGxhY2Vob2xkZXItc2VjcmV0LTMyYg==
lensbridge.app.jwtExpirationMs=900000

springdoc.api-docs.enabled=true
# Only makes Spring Boot create the JavaMailSender bean; no mail is sent.
spring.mail.host=localhost
# The committed spec is key-sorted, so a regenerated one only differs where the API does.
springdoc.writer-with-order-by-keys=true
springdoc.default-produces-media-type=application/json
